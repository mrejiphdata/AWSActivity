name: Deploy AWS Activity

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: github-aws-activity

  INPUT_BUCKET: github-aws-activity-input
  GLUE_JOB_SCRIPT: glue/ETLtrialJob.py

  GLUE_WORKFLOW: github-aws-activity-workflow
  GLUE_CRAWLER_SUCCESS_TRIGGER: github-aws-activity-crawler-success


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS credentials
      # ========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Verify AWS identity
      # ========================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================
      # 4. Deploy CloudFormation stack
      # ========================================
      # Creates/updates everything: IAM roles+policies, both S3 buckets,
      # the Lambda function (inline code - no zip/upload needed), the S3
      # -> Lambda notification, and the full Glue database / crawler /
      # job / workflow / triggers. CAPABILITY_NAMED_IAM is required
      # because the template creates IAM roles and policies with
      # explicit names.
      #
      # NOTE: this uses the low-level create-change-set / execute-change-set
      # calls instead of `aws cloudformation deploy`. That convenience
      # wrapper has a known bug where it crashes with a bare
      # "aws: [ERROR]: 'Status'" instead of a real error message while
      # polling change-set status - even when the change set itself
      # succeeded. The explicit waiters below don't share that bug, and
      # print the real failure reason from describe-stack-events instead.

      - name: Deploy CloudFormation stack
        run: |
          # A previous failed attempt can leave the stack stuck in
          # REVIEW_IN_PROGRESS (a change set that failed to create). Clear
          # it so this run isn't blocked by it.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "MISSING")

          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Stack stuck in REVIEW_IN_PROGRESS from a previous failed deploy - deleting it first."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            STACK_STATUS="MISSING"
          fi

          if [ "$STACK_STATUS" = "MISSING" ]; then
            CHANGESET_TYPE="CREATE"
          else
            CHANGESET_TYPE="UPDATE"
          fi

          CHANGESET_NAME="deploy-$(date +%s)"

          echo "Creating $CHANGESET_TYPE change set: $CHANGESET_NAME"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --change-set-type "$CHANGESET_TYPE" \
            --template-body file://cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM

          echo "Waiting for change set to finish creating..."

          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME"; then

            REASON=$(aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGESET_NAME" \
              --query 'StatusReason' --output text)

            if [[ "$REASON" == *"didn't contain changes"* ]]; then
              echo "No changes to deploy - nothing to do."
              aws cloudformation delete-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGESET_NAME"
              exit 0
            fi

            echo "Change set failed to create: $REASON"
            exit 1
          fi

          echo "Executing change set..."

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME"

          echo "Waiting for stack $CHANGESET_TYPE to complete..."

          WAITER="stack-create-complete"
          if [ "$CHANGESET_TYPE" = "UPDATE" ]; then
            WAITER="stack-update-complete"
          fi

          if ! aws cloudformation wait "$WAITER" --stack-name "$STACK_NAME"; then
            echo "Stack $CHANGESET_TYPE did not complete successfully. Failure events:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId,ResourceStatusReason]" \
              --output table
            exit 1
          fi

          echo "Stack deploy complete."


      # ========================================
      # 5. Upload Glue ETL script
      # ========================================
      # Must happen AFTER the stack deploy, since the input bucket is
      # created by that same stack. Glue does not validate that the
      # script exists at job-creation time (only when the job actually
      # runs), so this ordering is safe even on the very first deploy.

      - name: Upload Glue ETL script
        run: |
          aws s3 cp \
            "$GLUE_JOB_SCRIPT" \
            "s3://$INPUT_BUCKET/scripts/ETLtrialJob.py"

          echo "Glue ETL script uploaded."


      # ========================================
      # 6. Verify deployment
      # ========================================

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "DEPLOYMENT VERIFICATION"
          echo "========================================"

          echo ""
          echo "STACK STATUS:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text

          echo ""
          echo "STACK OUTPUTS:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table

          echo ""
          echo "CRAWLER SUCCESS TRIGGER STATE (must be ACTIVATED, not CREATED):"
          aws glue get-trigger \
            --name "$GLUE_CRAWLER_SUCCESS_TRIGGER" \
            --query 'Trigger.State' \
            --output text

          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded."
          echo "Use process.yml to process one CSV at a time."
