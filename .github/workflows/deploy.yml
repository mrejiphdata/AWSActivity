name: Deploy AWS Activity

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/template.yaml"
      - "glue/ETLtrialJob.py"
      - "lambda/lambda_function.py"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

  INPUT_BUCKET: github-aws-activity-input
  OUTPUT_BUCKET: github-aws-activity-output

  GLUE_DATABASE: github_aws_activity_db
  GLUE_TABLE: input
  GLUE_CRAWLER: github-aws-activity-crawler
  GLUE_JOB: github-aws-activity-etl
  GLUE_WORKFLOW: github-aws-activity-workflow

  LAMBDA_FUNCTION: github-aws-activity-lambda

  LAMBDA_ROLE: github-aws-activity-lambda-role
  GLUE_ROLE: github-aws-activity-glue-role


jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS credentials
      # ========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Verify AWS identity
      # ========================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================
      # 4. Validate CloudFormation template
      # ========================================

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml

          echo "CloudFormation template is valid."


      # ========================================
      # 5. Package and upload the Lambda code
      # ========================================
      #
      # lambda/lambda_function.py is the only copy of this code - the
      # template no longer inlines it. Naming the zip after a hash of the
      # file's contents (rather than a fixed key) means the S3 key changes
      # whenever the code changes, which is what makes CloudFormation
      # actually pick up the new code on the next deploy.

      - name: Package Lambda code
        run: |
          cd lambda
          zip -j lambda_function.zip lambda_function.py
          cd ..

          HASH=$(sha256sum lambda/lambda_function.zip | cut -c1-12)
          KEY="lambda/lambda_function-$HASH.zip"

          echo "LAMBDA_CODE_S3_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Packaged Lambda as $KEY"

      - name: Upload Lambda code
        run: |
          aws s3 cp \
            lambda/lambda_function.zip \
            "s3://$INPUT_BUCKET/$LAMBDA_CODE_S3_KEY"

          echo "Lambda code uploaded to s3://$INPUT_BUCKET/$LAMBDA_CODE_S3_KEY"


      # ========================================
      # 6. Deploy CloudFormation stack
      # ========================================
      #
      # CloudFormation now creates:
      # - Input S3 bucket
      # - Output S3 bucket
      # - IAM roles
      # - Glue database
      # - Glue crawler
      # - Glue ETL job
      # - Glue workflow
      # - Glue triggers
      # - Lambda
      # - S3 -> Lambda permission
      # - S3 -> Lambda notification
      #
      # Therefore the old CLI resource-creation steps 5-16
      # and 18-26 are no longer needed.
      #
      # Note: on a genuinely first-ever deploy (input bucket doesn't exist
      # yet), the "Upload Lambda code" step above would fail since the
      # bucket this stack is about to create doesn't exist until this step
      # runs. That's a one-time bootstrap wrinkle only - not an issue for
      # this project, since the bucket already exists.

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name github-aws-activity-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              InputBucketName="$INPUT_BUCKET" \
              OutputBucketName="$OUTPUT_BUCKET" \
              LambdaCodeS3Key="$LAMBDA_CODE_S3_KEY"

          echo "CloudFormation stack deployed."


      # ========================================
      # 7. Upload Glue ETL script
      # ========================================
      #
      # Your actual file is:
      #
      # glue/ETLtrialJob.py
      #
      # It is uploaded to:
      #
      # s3://github-aws-activity-input/scripts/ETLtrialJob.py
      #
      # The Glue job in template.yaml uses this location.

      - name: Upload Glue ETL script
        run: |
          aws s3 cp \
            glue/ETLtrialJob.py \
            "s3://$INPUT_BUCKET/scripts/ETLtrialJob.py"

          echo "Glue ETL script uploaded."


      # ========================================
      # 8. Verify deployment
      # ========================================

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "DEPLOYMENT VERIFICATION"
          echo "========================================"


          echo ""
          echo "INPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$INPUT_BUCKET"


          echo ""
          echo "OUTPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$OUTPUT_BUCKET"


          echo ""
          echo "GLUE DATABASE:"
          aws glue get-database \
            --name "$GLUE_DATABASE" \
            --query 'Database.Name' \
            --output text


          echo ""
          echo "GLUE CRAWLER:"
          aws glue get-crawler \
            --name "$GLUE_CRAWLER" \
            --query 'Crawler.Name' \
            --output text


          echo ""
          echo "GLUE JOB:"
          aws glue get-job \
            --job-name "$GLUE_JOB" \
            --query 'Job.Name' \
            --output text


          echo ""
          echo "GLUE WORKFLOW:"
          aws glue get-workflow \
            --name "$GLUE_WORKFLOW" \
            --query 'Workflow.Name' \
            --output text


          echo ""
          echo "START TRIGGER:"
          aws glue get-trigger \
            --name github-aws-activity-start \
            --query 'Trigger.Name' \
            --output text


          echo ""
          echo "CRAWLER SUCCESS TRIGGER:"
          aws glue get-trigger \
            --name github-aws-activity-crawler-success \
            --query 'Trigger.Name' \
            --output text


          echo ""
          echo "LAMBDA:"
          aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'Configuration.FunctionName' \
            --output text


          echo ""
          echo "S3 LAMBDA NOTIFICATION:"
          aws s3api get-bucket-notification-configuration \
            --bucket "$INPUT_BUCKET"


          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded."
          echo "Upload CSV files to:"
          echo "s3://$INPUT_BUCKET/input/"
