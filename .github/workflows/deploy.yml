name: Deploy AWS Activity with CloudFormation

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: github-aws-activity

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS credentials
      # ========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Verify AWS account
      # ========================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================
      # 4. Validate CloudFormation template
      # ========================================

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml

          echo "CloudFormation template is valid."


      # ========================================
      # 5. Upload Glue ETL script
      # ========================================
      # The input bucket is created by CloudFormation.
      # We therefore deploy the stack first, then upload
      # the Glue script.

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "CloudFormation stack deployment complete."


      # ========================================
      # 6. Upload Glue ETL script
      # ========================================

      - name: Upload Glue ETL script
        run: |
          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text)

          echo "Input bucket: $INPUT_BUCKET"

          aws s3 cp \
            glue/ETLtrialJob.py \
            "s3://$INPUT_BUCKET/scripts/ETLtrialJob.py"

          echo "Glue ETL script uploaded."


      # ========================================
      # 7. Verify CloudFormation resources
      # ========================================

      - name: Verify deployment
        run: |

          echo "========================================"
          echo "AWS ACTIVITY DEPLOYMENT"
          echo "========================================"

          echo ""
          echo "STACK:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "INPUT BUCKET:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text

          echo ""
          echo "OUTPUT BUCKET:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text

          echo ""
          echo "GLUE DATABASE:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='GlueDatabaseName'].OutputValue" \
            --output text

          echo ""
          echo "GLUE CRAWLER:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='GlueCrawlerName'].OutputValue" \
            --output text

          echo ""
          echo "GLUE JOB:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='GlueJobName'].OutputValue" \
            --output text

          echo ""
          echo "GLUE WORKFLOW:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='GlueWorkflowName'].OutputValue" \
            --output text

          echo ""
          echo "LAMBDA:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text

          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded by this deployment."
          echo "Upload/process one CSV at a time using process.yml."