name: Deploy CSV Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "template.yaml"
      - "scripts/transform.py"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      notification_email:
        description: "Email for pipeline failure alerts (optional)"
        required: false
        default: ""

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # 2. Configure AWS credentials
      # ========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ========================================
      # 3. Validate CloudFormation template
      # ========================================

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://template.yaml

          echo "CloudFormation template is valid."

      # ========================================
      # 4. Deploy CloudFormation stack
      # ========================================
      #
      # CloudFormation now creates/updates:
      # S3 buckets
      # IAM roles
      # Glue database
      # Glue crawler
      # Glue job
      # Glue workflow
      # Glue triggers
      # Lambda
      # S3 -> Lambda permission
      # S3 -> Lambda notification
      # Optional SNS/EventBridge alerts
      #
      # Sections 22-26 from the old deploy.yml are therefore
      # no longer required as separate AWS CLI commands.

      - name: Deploy CloudFormation stack
        run: |
          NOTIFICATION_EMAIL="${{ github.event.inputs.notification_email }}"

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name csv-pipeline-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              NotificationEmail="$NOTIFICATION_EMAIL"

      # ========================================
      # 5. Get stack outputs
      # ========================================

      - name: Get CloudFormation outputs
        run: |
          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name csv-pipeline-stack \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name csv-pipeline-stack \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text)

          SCRIPTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name csv-pipeline-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ScriptsBucketName'].OutputValue" \
            --output text)

          echo "INPUT_BUCKET=$INPUT_BUCKET" >> "$GITHUB_ENV"
          echo "OUTPUT_BUCKET=$OUTPUT_BUCKET" >> "$GITHUB_ENV"
          echo "SCRIPTS_BUCKET=$SCRIPTS_BUCKET" >> "$GITHUB_ENV"

          echo "Input bucket: $INPUT_BUCKET"
          echo "Output bucket: $OUTPUT_BUCKET"
          echo "Scripts bucket: $SCRIPTS_BUCKET"

      # ========================================
      # 6. Upload Glue ETL script
      # ========================================
      #
      # CloudFormation creates the Scripts bucket and Glue job.
      # This step uploads the actual transform.py file used by
      # the Glue Python Shell job.

      - name: Upload Glue ETL script
        run: |
          aws s3 cp \
            scripts/transform.py \
            "s3://${SCRIPTS_BUCKET}/scripts/transform.py"

          echo "transform.py uploaded successfully."

      # ========================================
      # 7. Verify deployment
      # ========================================
      #
      # This replaces section 27 from the old deploy.yml.

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "DEPLOYMENT VERIFICATION"
          echo "========================================"

          echo ""
          echo "INPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$INPUT_BUCKET"

          echo ""
          echo "OUTPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$OUTPUT_BUCKET"

          echo ""
          echo "SCRIPTS BUCKET:"
          aws s3api head-bucket \
            --bucket "$SCRIPTS_BUCKET"

          echo ""
          echo "GLUE DATABASE:"
          aws glue get-database \
            --name "aws_bootcamp_db_v2" \
            --query 'Database.Name' \
            --output text

          echo ""
          echo "GLUE CRAWLER:"
          aws glue get-crawler \
            --name "bootcamp-crawler-data-v2" \
            --query 'Crawler.Name' \
            --output text

          echo ""
          echo "GLUE JOB:"
          aws glue get-job \
            --job-name "csv-transform-job-v2" \
            --query 'Job.Name' \
            --output text

          echo ""
          echo "GLUE WORKFLOW:"
          aws glue get-workflow \
            --name "csv-ingestion-workflow-v2" \
            --query 'Workflow.Name' \
            --output text

          echo ""
          echo "START TRIGGER:"
          aws glue get-trigger \
            --name "start-workflow-trigger-v2" \
            --query 'Trigger.Name' \
            --output text

          echo ""
          echo "CRAWLER SUCCESS TRIGGER:"
          aws glue get-trigger \
            --name "crawler-success-trigger-v2" \
            --query 'Trigger.Name' \
            --output text

          echo ""
          echo "LAMBDA:"
          aws lambda get-function \
            --function-name "start-glue-workflow-on-upload-v2" \
            --query 'Configuration.FunctionName' \
            --output text

          echo ""
          echo "S3 -> LAMBDA NOTIFICATION:"
          aws s3api get-bucket-notification-configuration \
            --bucket "$INPUT_BUCKET"

          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded."
