name: Deploy CSV Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/template.yaml"
      - "glue/ETLtrialJob.py"
      - "lambda/lambda_function.py"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      notification_email:
        description: "Email for pipeline failure alerts (optional)"
        required: false
        default: ""

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS credentials
      # ========================================
      #
      # IMPORTANT:
      # Replace ap-south-1 if your AWS resources
      # are in another region.
      #
      # This avoids the previous:
      # "Input required and not supplied: aws-region"
      # error.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      # ========================================
      # 3. Validate CloudFormation template
      # ========================================

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml

          echo "CloudFormation template is valid."


      # ========================================
      # 4. Deploy CloudFormation stack
      # ========================================
      #
      # CloudFormation creates/updates:
      #
      # S3 buckets
      # IAM roles
      # Glue database
      # Glue crawler
      # Glue job
      # Glue workflow
      # Glue triggers
      # Lambda
      # S3 -> Lambda permission
      # S3 -> Lambda notification
      # Optional SNS/EventBridge alerts
      #
      # Therefore the old CLI sections 22-26
      # are no longer separate AWS CLI commands.

      - name: Deploy CloudFormation stack
        run: |
          NOTIFICATION_EMAIL="${{ github.event.inputs.notification_email }}"

          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name github-aws-activity-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              NotificationEmail="$NOTIFICATION_EMAIL"


      # ========================================
      # 5. Get CloudFormation outputs
      # ========================================

      - name: Get CloudFormation outputs
        run: |

          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text)

          SCRIPTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ScriptsBucketName'].OutputValue" \
            --output text)

          GLUE_DATABASE=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='GlueDatabaseName'].OutputValue" \
            --output text)

          GLUE_CRAWLER=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='GlueCrawlerName'].OutputValue" \
            --output text)

          GLUE_JOB=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='GlueJobName'].OutputValue" \
            --output text)

          GLUE_WORKFLOW=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='GlueWorkflowName'].OutputValue" \
            --output text)

          LAMBDA_FUNCTION=$(aws cloudformation describe-stacks \
            --stack-name github-aws-activity-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)

          echo "INPUT_BUCKET=$INPUT_BUCKET" >> "$GITHUB_ENV"
          echo "OUTPUT_BUCKET=$OUTPUT_BUCKET" >> "$GITHUB_ENV"
          echo "SCRIPTS_BUCKET=$SCRIPTS_BUCKET" >> "$GITHUB_ENV"
          echo "GLUE_DATABASE=$GLUE_DATABASE" >> "$GITHUB_ENV"
          echo "GLUE_CRAWLER=$GLUE_CRAWLER" >> "$GITHUB_ENV"
          echo "GLUE_JOB=$GLUE_JOB" >> "$GITHUB_ENV"
          echo "GLUE_WORKFLOW=$GLUE_WORKFLOW" >> "$GITHUB_ENV"
          echo "LAMBDA_FUNCTION=$LAMBDA_FUNCTION" >> "$GITHUB_ENV"

          echo "Input bucket: $INPUT_BUCKET"
          echo "Output bucket: $OUTPUT_BUCKET"
          echo "Scripts bucket: $SCRIPTS_BUCKET"
          echo "Glue database: $GLUE_DATABASE"
          echo "Glue crawler: $GLUE_CRAWLER"
          echo "Glue job: $GLUE_JOB"
          echo "Glue workflow: $GLUE_WORKFLOW"
          echo "Lambda: $LAMBDA_FUNCTION"


      # ========================================
      # 6. Upload Glue ETL script
      # ========================================
      #
      # Local:
      # glue/ETLtrialJob.py
      #
      # S3:
      # s3://<scripts-bucket>/glue/ETLtrialJob.py

      - name: Upload Glue ETL script
        run: |

          aws s3 cp \
            glue/ETLtrialJob.py \
            "s3://${SCRIPTS_BUCKET}/glue/ETLtrialJob.py"

          echo "ETLtrialJob.py uploaded."


      # ========================================
      # 7. Verify deployment
      # ========================================

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "DEPLOYMENT VERIFICATION"
          echo "========================================"


          echo ""
          echo "INPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$INPUT_BUCKET"


          echo ""
          echo "OUTPUT BUCKET:"
          aws s3api head-bucket \
            --bucket "$OUTPUT_BUCKET"


          echo ""
          echo "SCRIPTS BUCKET:"
          aws s3api head-bucket \
            --bucket "$SCRIPTS_BUCKET"


          echo ""
          echo "GLUE DATABASE:"
          aws glue get-database \
            --name "$GLUE_DATABASE" \
            --query 'Database.Name' \
            --output text


          echo ""
          echo "GLUE CRAWLER:"
          aws glue get-crawler \
            --name "$GLUE_CRAWLER" \
            --query 'Crawler.Name' \
            --output text


          echo ""
          echo "GLUE JOB:"
          aws glue get-job \
            --job-name "$GLUE_JOB" \
            --query 'Job.Name' \
            --output text


          echo ""
          echo "GLUE WORKFLOW:"
          aws glue get-workflow \
            --name "$GLUE_WORKFLOW" \
            --query 'Workflow.Name' \
            --output text


          echo ""
          echo "START TRIGGER:"
          aws glue get-trigger \
            --name github-aws-activity-start \
            --query 'Trigger.Name' \
            --output text


          echo ""
          echo "START TRIGGER STATE:"
          aws glue get-trigger \
            --name github-aws-activity-start \
            --query 'Trigger.State' \
            --output text


          echo ""
          echo "CRAWLER SUCCESS TRIGGER:"
          aws glue get-trigger \
            --name github-aws-activity-crawler-success \
            --query 'Trigger.Name' \
            --output text


          echo ""
          echo "CRAWLER SUCCESS TRIGGER STATE:"
          aws glue get-trigger \
            --name github-aws-activity-crawler-success \
            --query 'Trigger.State' \
            --output text


          echo ""
          echo "LAMBDA:"
          aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'Configuration.FunctionName' \
            --output text


          echo ""
          echo "S3 -> LAMBDA NOTIFICATION:"
          aws s3api get-bucket-notification-configuration \
            --bucket "$INPUT_BUCKET"


          echo ""
          echo "GLUE SCRIPT:"
          aws s3api head-object \
            --bucket "$SCRIPTS_BUCKET" \
            --key glue/ETLtrialJob.py


          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded."
