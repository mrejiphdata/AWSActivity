name: Deploy AWS Activity

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: github-aws-activity

  INPUT_BUCKET: github-aws-activity-input
  GLUE_JOB_SCRIPT: glue/ETLtrialJob.py

  GLUE_WORKFLOW: github-aws-activity-workflow
  GLUE_CRAWLER_SUCCESS_TRIGGER: github-aws-activity-crawler-success


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout repository
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS credentials
      # ========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Verify AWS identity
      # ========================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ========================================
      # 4. Deploy CloudFormation stack
      # ========================================
      # Creates/updates everything: IAM roles+policies, both S3 buckets,
      # the Lambda function (inline code - no zip/upload needed), the S3
      # -> Lambda notification, and the full Glue database / crawler /
      # job / workflow / triggers. CAPABILITY_NAMED_IAM is required
      # because the template creates IAM roles and policies with
      # explicit names.

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file cloudformation/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Stack deploy complete."


      # ========================================
      # 5. Upload Glue ETL script
      # ========================================
      # Must happen AFTER the stack deploy, since the input bucket is
      # created by that same stack. Glue does not validate that the
      # script exists at job-creation time (only when the job actually
      # runs), so this ordering is safe even on the very first deploy.

      - name: Upload Glue ETL script
        run: |
          aws s3 cp \
            "$GLUE_JOB_SCRIPT" \
            "s3://$INPUT_BUCKET/scripts/ETLtrialJob.py"

          echo "Glue ETL script uploaded."


      # ========================================
      # 6. Verify deployment
      # ========================================

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "DEPLOYMENT VERIFICATION"
          echo "========================================"

          echo ""
          echo "STACK STATUS:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text

          echo ""
          echo "STACK OUTPUTS:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table

          echo ""
          echo "CRAWLER SUCCESS TRIGGER STATE (must be ACTIVATED, not CREATED):"
          aws glue get-trigger \
            --name "$GLUE_CRAWLER_SUCCESS_TRIGGER" \
            --query 'Trigger.State' \
            --output text

          echo ""
          echo "========================================"
          echo "DEPLOYMENT COMPLETE"
          echo "========================================"

          echo ""
          echo "No CSV files were uploaded."
          echo "Use process.yml to process one CSV at a time."
