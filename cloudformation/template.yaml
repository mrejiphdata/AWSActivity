AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Activity serverless CSV ETL pipeline.
  S3 input -> Lambda -> Glue Workflow -> Crawler -> ETL Job -> S3 output.

# ============================================================
# Parameters
# ============================================================

Parameters:

  InputBucketName:
    Type: String
    Default: github-aws-activity-input

  OutputBucketName:
    Type: String
    Default: github-aws-activity-output

  GlueDatabaseName:
    Type: String
    Default: github_aws_activity_db


# ============================================================
# Conditions
# ============================================================

Conditions:

  AlwaysCreate: !Equals ["true", "true"]


Resources:

  # ==========================================================
  # 1. Input S3 bucket
  # ==========================================================

  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true


  # ==========================================================
  # 2. Output S3 bucket
  # ==========================================================

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true


  # ==========================================================
  # 3. Lambda IAM role
  # ==========================================================

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: github-aws-activity-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflowRun
                Resource: !Sub
                  - arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:workflow/${WorkflowName}
                  - WorkflowName: !Ref GlueWorkflow

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${InputBucket.Arn}/input/*'


  # ==========================================================
  # 4. Glue IAM role
  # ==========================================================

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-glue-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:
        - PolicyName: github-aws-activity-glue-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !GetAtt OutputBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub '${InputBucket.Arn}/input/*'
                  - !Sub '${InputBucket.Arn}/scripts/*'

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${OutputBucket.Arn}/*'


  # ==========================================================
  # 5. Glue database
  # ==========================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: AWS Activity Glue database


  # ==========================================================
  # 6. Glue crawler
  # ==========================================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: github-aws-activity-crawler
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub 's3://${InputBucketName}/input/'

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG


  # ==========================================================
  # 7. Glue Python Shell ETL job
  # ==========================================================
  #
  # deploy.yml uploads:
  # glue/ETLtrialJob.py
  # to:
  # s3://github-aws-activity-input/scripts/ETLtrialJob.py
  #
  # The job is created by CloudFormation and the script is
  # uploaded by GitHub Actions.

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: github-aws-activity-etl
      Role: !GetAtt GlueRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub 's3://${InputBucketName}/scripts/ETLtrialJob.py'

      DefaultArguments:
        '--library-set': analytics
        '--INPUT_BUCKET': !Ref InputBucketName
        '--OUTPUT_BUCKET': !Ref OutputBucketName

      MaxCapacity: 0.0625
      MaxRetries: 0
      GlueVersion: '3.0'
      Timeout: 30


  # ==========================================================
  # 8. Glue workflow
  # ==========================================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: github-aws-activity-workflow
      Description: AWS Activity serverless ETL workflow
      MaxConcurrentRuns: 1


  # ==========================================================
  # 9. Workflow start trigger
  # ==========================================================
  #
  # Lambda starts the workflow.
  # This ON_DEMAND trigger then starts the crawler.

  WorkflowStartTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueWorkflow
      - GlueCrawler
    Properties:
      Name: github-aws-activity-start
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflow
      Actions:
        - CrawlerName: !Ref GlueCrawler
      StartOnCreation: false


  # ==========================================================
  # 10. Crawler success trigger
  # ==========================================================
  #
  # This replaces old deploy.yml step 22.
  # StartOnCreation: true means the trigger is active after
  # CloudFormation creates it. No aws glue start-trigger is
  # needed.

  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - WorkflowStartTrigger
      - GlueETLJob
    Properties:
      Name: github-aws-activity-crawler-success
      Type: CONDITIONAL
      WorkflowName: !Ref GlueWorkflow
      StartOnCreation: true

      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueETLJob


  # ==========================================================
  # 11. Lambda function
  # ==========================================================
  #
  # CloudFormation embeds the small S3 -> Glue workflow
  # launcher. Therefore lambda.zip is NOT required.
  #
  # The repository can still keep:
  # lambda/lambda_function.py
  # as the source/reference implementation.

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: github-aws-activity-lambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          WORKFLOW_NAME: !Ref GlueWorkflow

      Code:
        ZipFile: |
          import boto3
          import os
          import urllib.parse

          glue = boto3.client("glue")
          WORKFLOW_NAME = os.environ["WORKFLOW_NAME"]

          def lambda_handler(event, context):
              for record in event.get("Records", []):
                  key = record["s3"]["object"]["key"]
                  key = urllib.parse.unquote_plus(key)

                  if key.lower().endswith(".csv"):
                      response = glue.start_workflow_run(
                          Name=WORKFLOW_NAME
                      )

                      print(
                          f"Started workflow run "
                          f"{response['RunId']} for file {key}"
                      )

              return {
                  "statusCode": 200
              }


  # ==========================================================
  # 12. Allow S3 to invoke Lambda
  # ==========================================================
  #
  # This replaces old deploy.yml step 25.

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
      SourceAccount: !Ref AWS::AccountId


  # ==========================================================
  # 13. IAM role for S3 notification custom resource
  # ==========================================================

  BucketNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-s3-notification-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: github-aws-activity-s3-notification-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource: !GetAtt InputBucket.Arn


  # ==========================================================
  # 14. Lambda for S3 notification custom resource
  # ==========================================================
  #
  # This avoids the S3 -> Lambda circular dependency:
  #
  # S3 bucket
  #    |
  #    +--> Lambda permission
  #    |
  #    +--> notification
  #
  # CloudFormation waits until the Lambda permission exists
  # before configuring the notification.

  BucketNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: github-aws-activity-s3-notification
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketNotificationRole.Arn
      Timeout: 60

      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request

          s3 = boto3.client("s3")

          def send_response(event, context, status, data, physical_id):
              body = json.dumps({
                  "Status": status,
                  "Reason": (
                      "See CloudWatch Log Stream: "
                      + context.log_stream_name
                  ),
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data
              }).encode("utf-8")

              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "",
                      "Content-Length": str(len(body))
                  }
              )

              urllib.request.urlopen(request)

          def handler(event, context):
              props = event["ResourceProperties"]
              bucket = props["BucketName"]
              lambda_arn = props["LambdaArn"]

              physical_id = "s3-notification-" + bucket

              try:
                  if event["RequestType"] in ("Create", "Update"):
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              "LambdaFunctionConfigurations": [
                                  {
                                      "Id": "github-aws-activity-csv-trigger",
                                      "LambdaFunctionArn": lambda_arn,
                                      "Events": [
                                          "s3:ObjectCreated:*"
                                      ],
                                      "Filter": {
                                          "Key": {
                                              "FilterRules": [
                                                  {
                                                      "Name": "prefix",
                                                      "Value": "input/"
                                                  },
                                                  {
                                                      "Name": "suffix",
                                                      "Value": ".csv"
                                                  }
                                              ]
                                          }
                                      }
                                  }
                              ]
                          }
                      )

                  elif event["RequestType"] == "Delete":
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {},
                      physical_id
                  )

              except Exception as error:
                  print(str(error))

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(error)},
                      physical_id
                  )


  # ==========================================================
  # 15. Configure S3 -> Lambda notification
  # ==========================================================

  ConfigureBucketNotification:
    Type: Custom::S3LambdaNotification
    DependsOn:
      - LambdaInvokePermission
      - BucketNotificationFunction
    Properties:
      ServiceToken: !GetAtt BucketNotificationFunction.Arn
      BucketName: !Ref InputBucket
      LambdaArn: !GetAtt LambdaFunction.Arn
      ConfigVersion: '1'


# ============================================================
# Outputs
# ============================================================

Outputs:

  InputBucketName:
    Description: Input S3 bucket
    Value: !Ref InputBucket

  OutputBucketName:
    Description: Output S3 bucket
    Value: !Ref OutputBucket

  GlueDatabaseName:
    Description: Glue database
    Value: !Ref GlueDatabase

  GlueCrawlerName:
    Description: Glue crawler
    Value: !Ref GlueCrawler

  GlueJobName:
    Description: Glue ETL job
    Value: !Ref GlueETLJob

  GlueWorkflowName:
    Description: Glue workflow
    Value: !Ref GlueWorkflow

  LambdaFunctionName:
    Description: Lambda function triggered by S3
    Value: !Ref LambdaFunction

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LambdaFunction.Arn
