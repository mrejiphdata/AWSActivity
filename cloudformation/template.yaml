AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CSV ingestion pipeline:
  S3 input -> Lambda -> Glue Workflow -> Crawler -> Glue ETL Job -> S3 output.

Parameters:

  InputBucketName:
    Type: String
    Default: aws-bootcamp-input-v2
    Description: Bucket where CSV files are uploaded under input/.

  OutputBucketName:
    Type: String
    Default: aws-bootcamp-output-v2
    Description: Bucket where transformed output is written.

  ScriptsBucketName:
    Type: String
    Default: aws-bootcamp-scripts-v2
    Description: Bucket containing the Glue ETL Python script.

  GlueDatabaseName:
    Type: String
    Default: aws_bootcamp_db_v2
    Description: Glue Data Catalog database name.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email for pipeline failure alerts.

Conditions:

  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:

  # ========================================
  # 1. S3 Buckets
  # ========================================

  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ScriptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ScriptsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ========================================
  # 2. IAM Role for Lambda
  # ========================================

  LambdaGlueTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaGlueTriggerRole-CFN
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: LambdaGlueTriggerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflowRun
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${GlueWorkflow}"

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}/input/*"

  # ========================================
  # 3. IAM Role for Glue
  # ========================================

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GlueETLRole-CFN
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:
        - PolicyName: GlueS3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}"
                  - !Sub "arn:aws:s3:::${OutputBucketName}"
                  - !Sub "arn:aws:s3:::${ScriptsBucketName}"

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}/*"
                  - !Sub "arn:aws:s3:::${OutputBucketName}/*"
                  - !Sub "arn:aws:s3:::${ScriptsBucketName}/*"

  # ========================================
  # 4. Glue Database
  # ========================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName

  # ========================================
  # 5. Glue Crawler
  # ========================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: bootcamp-crawler-data-v2
      Role: !GetAtt GlueServiceRole.Arn
      DatabaseName: !Ref GlueDatabaseName

      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/input/"

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

      # No Schedule property.
      # The crawler is started by the Glue workflow.

  # ========================================
  # 6. Glue ETL Job
  # ========================================

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: csv-transform-job-v2
      Role: !GetAtt GlueServiceRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptsBucketName}/scripts/transform.py"

      DefaultArguments:
        "--INPUT_BUCKET": !Ref InputBucketName
        "--OUTPUT_BUCKET": !Ref OutputBucketName

      MaxCapacity: 0.0625
      GlueVersion: "3.0"
      Timeout: 30

  # ========================================
  # 7. Glue Workflow
  # ========================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: csv-ingestion-workflow-v2
      Description: Orchestrates crawler -> ETL job for CSV ingestion.

  # ========================================
  # 8. Start Trigger
  # ========================================
  # This replaces the CLI logic that starts the crawler.
  #
  # Lambda starts the workflow.
  # This ON_DEMAND trigger then starts the crawler.

  StartWorkflowTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: start-workflow-trigger-v2
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflow

      Actions:
        - CrawlerName: !Ref GlueCrawler

      StartOnCreation: false

  # ========================================
  # 9. Crawler Success Trigger
  # ========================================
  # This replaces section 22 of deploy.yml.
  #
  # CloudFormation creates the trigger in ACTIVE state because
  # StartOnCreation is true.
  # No aws glue start-trigger command is required.

  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: crawler-success-trigger-v2
      Type: CONDITIONAL
      WorkflowName: !Ref GlueWorkflow

      StartOnCreation: true

      Predicate:
        Logical: ANY
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueETLJob

  # ========================================
  # 10. Lambda Function
  # ========================================
  # This replaces sections 23 and 24 of deploy.yml.
  #
  # The Lambda code is embedded directly in CloudFormation,
  # so GitHub Actions does NOT need to create lambda.zip.

  StartGlueWorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: start-glue-workflow-on-upload-v2
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaGlueTriggerRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          WORKFLOW_NAME: !Ref GlueWorkflow

      Code:
        ZipFile: |
          import boto3
          import os
          import urllib.parse

          glue = boto3.client("glue")
          WORKFLOW_NAME = os.environ["WORKFLOW_NAME"]

          def lambda_handler(event, context):
              for record in event.get("Records", []):

                  key = record["s3"]["object"]["key"]
                  key = urllib.parse.unquote_plus(key)

                  if key.lower().endswith(".csv"):

                      response = glue.start_workflow_run(
                          Name=WORKFLOW_NAME
                      )

                      print(
                          f"Started workflow run "
                          f"{response['RunId']} for file {key}"
                      )

              return {
                  "statusCode": 200
              }

  # ========================================
  # 11. Allow S3 to invoke Lambda
  # ========================================
  # This replaces section 25 of deploy.yml.

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartGlueWorkflowFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"
      SourceAccount: !Ref AWS::AccountId

  # ========================================
  # 12. Lambda for S3 Notification Custom Resource
  # ========================================
  # This is required because directly putting an S3 notification
  # and Lambda permission in the same stack can create a dependency
  # cycle.
  #
  # CloudFormation invokes this Lambda after the bucket and
  # Lambda permission have been created.

  BucketNotificationConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: configure-input-bucket-notification-v2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketNotificationConfigRole.Arn
      Timeout: 60

      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request

          s3 = boto3.client("s3")

          def send_response(
              event,
              context,
              status,
              data,
              physical_resource_id
          ):
              body = json.dumps({
                  "Status": status,
                  "Reason": (
                      f"See CloudWatch Log Stream: "
                      f"{context.log_stream_name}"
                  ),
                  "PhysicalResourceId": physical_resource_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data
              }).encode("utf-8")

              request = urllib.request.Request(
                  url=event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "",
                      "Content-Length": str(len(body))
                  }
              )

              urllib.request.urlopen(request)

          def handler(event, context):

              props = event["ResourceProperties"]

              bucket = props["BucketName"]
              lambda_arn = props["LambdaArn"]

              physical_resource_id = (
                  f"s3-notification-{bucket}"
              )

              try:

                  if event["RequestType"] in ("Create", "Update"):

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              "LambdaFunctionConfigurations": [
                                  {
                                      "Id": "csv-upload-trigger",
                                      "LambdaFunctionArn": lambda_arn,
                                      "Events": [
                                          "s3:ObjectCreated:*"
                                      ],
                                      "Filter": {
                                          "Key": {
                                              "FilterRules": [
                                                  {
                                                      "Name": "prefix",
                                                      "Value": "input/"
                                                  },
                                                  {
                                                      "Name": "suffix",
                                                      "Value": ".csv"
                                                  }
                                              ]
                                          }
                                      }
                                  }
                              ]
                          }
                      )

                  elif event["RequestType"] == "Delete":

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {},
                      physical_resource_id
                  )

              except Exception as e:

                  print(f"Error: {e}")

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(e)},
                      physical_resource_id
                  )

  # ========================================
  # 13. IAM Role for Notification Custom Resource
  # ========================================

  BucketNotificationConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BucketNotificationConfigRole-CFN

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: S3NotificationConfigPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource:
                  - !Sub "arn:aws:s3:::${InputBucketName}"

  # ========================================
  # 14. Configure S3 -> Lambda Notification
  # ========================================
  # This replaces section 26 of deploy.yml.

  BucketNotificationConfig:
    Type: Custom::S3BucketNotification

    DependsOn:
      - LambdaInvokePermission

    Properties:
      ServiceToken: !GetAtt BucketNotificationConfigFunction.Arn
      BucketName: !Ref InputBucketName
      LambdaArn: !GetAtt StartGlueWorkflowFunction.Arn

      # Change this version if notification code changes.
      ConfigVersion: "1"

  # ========================================
  # 15. Optional SNS Alert Topic
  # ========================================

  AlertsTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: pipeline-alerts-v2

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ========================================
  # 16. EventBridge Rule - Glue Job Failure
  # ========================================

  GlueJobFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: csv-pipeline-glue-job-failure-v2
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Job State Change
        detail:
          jobName:
            - !Ref GlueETLJob
          state:
            - FAILED
      Targets:
        - Arn: !Ref AlertsTopic
          Id: GlueJobFailureTarget

  # ========================================
  # 17. EventBridge Rule - Glue Crawler Failure
  # ========================================

  GlueCrawlerFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: csv-pipeline-crawler-failure-v2
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Crawler State Change
        detail:
          crawlerName:
            - !Ref GlueCrawler
          state:
            - FAILED
      Targets:
        - Arn: !Ref AlertsTopic
          Id: GlueCrawlerFailureTarget

  # ========================================
  # 18. SNS Topic Policy
  # ========================================

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasNotificationEmail
    Properties:
      Topics:
        - !Ref AlertsTopic

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref AlertsTopic

# ========================================
# Outputs
# ========================================

Outputs:

  InputBucketName:
    Description: Input S3 bucket
    Value: !Ref InputBucket

  OutputBucketName:
    Description: Output S3 bucket
    Value: !Ref OutputBucket

  ScriptsBucketName:
    Description: Bucket containing transform.py
    Value: !Ref ScriptsBucket

  GlueDatabaseName:
    Description: Glue database
    Value: !Ref GlueDatabaseName

  GlueCrawlerName:
    Description: Glue crawler
    Value: !Ref GlueCrawler

  GlueJobName:
    Description: Glue ETL job
    Value: !Ref GlueETLJob

  GlueWorkflowName:
    Description: Glue workflow
    Value: !Ref GlueWorkflow

  LambdaFunctionName:
    Description: Lambda function triggered by S3
    Value: !Ref StartGlueWorkflowFunction

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt StartGlueWorkflowFunction.Arn
