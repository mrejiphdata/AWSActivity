AWSTemplateFormatVersion: '2010-09-09'

Description: GitHub AWS Activity - CloudFormation Infrastructure

Parameters:
  InputBucketName:
    Type: String
    Default: github-aws-activity-input

  OutputBucketName:
    Type: String
    Default: github-aws-activity-output

  LambdaCodeS3Key:
    Type: String
    Description: >
      S3 key (inside InputBucketName) of the zipped lambda/lambda_function.py
      deployment package. deploy.yml uploads a new key (content-hashed) each
      time the file changes, so this always points at the exact code that's
      deployed - no more inline-vs-file drift.
    Default: lambda/lambda_function.zip


Resources:

  # ============================================================
  # S3 BUCKETS
  # ============================================================

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  # ============================================================
  # S3-NOTIFICATION HELPER LAMBDA ROLE
  # ============================================================
  # Only wires up the bucket notification - no S3 object access, no Glue
  # access.

  S3NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-s3-notification-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: github-aws-activity-s3-notification-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !GetAtt InputBucket.Arn


  # ============================================================
  # PROCESSING LAMBDA ROLE
  # ============================================================
  # Only starts the Glue workflow - no S3 access and no bucket-notification
  # rights, since it never touches either.

  ProcessingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: github-aws-activity-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflow
                  - glue:GetWorkflowRun
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/github-aws-activity-workflow'


  # ============================================================
  # GLUE ROLE
  # ============================================================

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-glue-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: github-aws-activity-glue-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # S3 access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub '${InputBucket.Arn}/*'
                  - !GetAtt OutputBucket.Arn
                  - !Sub '${OutputBucket.Arn}/*'

              # Glue access - scoped to this project's own catalog database,
              # table, crawler, job and workflow instead of Resource: '*'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/github_aws_activity_db'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/github_aws_activity_db/*'

              - Effect: Allow
                Action:
                  - glue:StartCrawler
                  - glue:GetCrawler
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/github-aws-activity-crawler'

              - Effect: Allow
                Action:
                  - glue:GetJob
                  - glue:StartJobRun
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/github-aws-activity-etl'

              - Effect: Allow
                Action:
                  - glue:GetWorkflowRunProperties
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/github-aws-activity-workflow'

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'


  # ============================================================
  # GLUE DATABASE
  # ============================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: github_aws_activity_db


  # ============================================================
  # GLUE CRAWLER
  # ============================================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn:
      - GlueRole
      - InputBucket
      - GlueDatabase

    Properties:
      Name: github-aws-activity-crawler
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase

      Targets:
        S3Targets:
          - Path: !Sub 's3://${InputBucket}/input/'

      TablePrefix: ''

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG


  # ============================================================
  # GLUE JOB
  # ============================================================

  GlueJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueRole
      - InputBucket

    Properties:
      Name: github-aws-activity-etl
      Role: !GetAtt GlueRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub 's3://${InputBucket}/scripts/ETLtrialJob.py'

      MaxCapacity: 0.0625
      MaxRetries: 0

      # Output bucket / catalog database / table are passed in here instead
      # of being hard-coded inside ETLtrialJob.py.
      DefaultArguments:
        '--library-set': analytics
        '--OUTPUT_BUCKET': !Ref OutputBucketName
        '--DATABASE_NAME': !Ref GlueDatabase
        '--TABLE_NAME': 'input'


  # ============================================================
  # GLUE WORKFLOW
  # ============================================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: github-aws-activity-workflow
      # Raised from 1 so two CSVs landing close together don't cause the
      # second upload's workflow run to be rejected outright. The crawler
      # itself can still only run one crawl at a time (an AWS-side limit,
      # not configurable here) - see lambda_function.py's retry logic for
      # the rest of the fix.
      MaxConcurrentRuns: 5


  # ============================================================
  # START TRIGGER
  # ============================================================

  StartTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueCrawler
      - GlueWorkflow

    Properties:
      Name: github-aws-activity-start
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflow

      Actions:
        - CrawlerName: !Ref GlueCrawler


  # ============================================================
  # CRAWLER SUCCESS TRIGGER
  # ============================================================

  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueCrawler
      - GlueJob
      - GlueWorkflow

    Properties:
      Name: github-aws-activity-crawler-success
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref GlueWorkflow

      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueJob


  # ============================================================
  # S3 NOTIFICATION LAMBDA
  # ============================================================

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - S3NotificationRole
    Properties:
      FunctionName: github-aws-activity-s3-notification
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt S3NotificationRole.Arn

      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          s3 = boto3.client("s3")

          def send_response(event, context, status, data=None):
              response = {
                  "Status": status,
                  "Reason": "See CloudWatch logs",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              }

              body = json.dumps(response).encode("utf-8")

              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT"
              )

              req.add_header("Content-Type", "")
              req.add_header("Content-Length", str(len(body)))

              urllib.request.urlopen(req)

          def handler(event, context):

              try:
                  bucket = event["ResourceProperties"]["Bucket"]
                  target_lambda = event["ResourceProperties"]["LambdaArn"]

                  if event["RequestType"] == "Delete":
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  else:
                      configuration = {
                          "LambdaFunctionConfigurations": [
                              {
                                  "LambdaFunctionArn": target_lambda,
                                  "Events": ["s3:ObjectCreated:*"],
                                  "Filter": {
                                      "Key": {
                                          "FilterRules": [
                                              {
                                                  "Name": "prefix",
                                                  "Value": "input/"
                                              },
                                              {
                                                  "Name": "suffix",
                                                  "Value": ".csv"
                                              }
                                          ]
                                      }
                                  }
                              }
                          ]
                      }

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=configuration
                      )

                  send_response(event, context, "SUCCESS")

              except Exception as e:
                  print(e)

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(e)}
                  )


  # ============================================================
  # ACTUAL PROCESSING LAMBDA
  # ============================================================
  # Deployed from the zipped lambda/lambda_function.py (uploaded to S3 by
  # deploy.yml) instead of an inline ZipFile, so the file in the repo is the
  # only copy of the code - nothing to drift out of sync.

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ProcessingLambdaRole

    Properties:
      FunctionName: github-aws-activity-lambda
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt ProcessingLambdaRole.Arn

      Code:
        S3Bucket: !Ref InputBucketName
        S3Key: !Ref LambdaCodeS3Key


  # ============================================================
  # PERMISSION FOR S3 TO INVOKE ACTUAL LAMBDA
  # ============================================================

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt InputBucket.Arn
      SourceAccount: !Ref AWS::AccountId


  # ============================================================
  # CUSTOM RESOURCE TO CONFIGURE S3 NOTIFICATION
  # ============================================================

  ConfigureBucketNotification:
    Type: Custom::S3LambdaNotification

    DependsOn:
      - S3NotificationFunction
      - LambdaFunction
      - LambdaInvokePermission

    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      Bucket: !Ref InputBucket
      LambdaArn: !GetAtt LambdaFunction.Arn


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  InputBucket:
    Description: Input S3 bucket
    Value: !Ref InputBucket

  OutputBucket:
    Description: Output S3 bucket
    Value: !Ref OutputBucket

  GlueDatabase:
    Description: Glue database
    Value: !Ref GlueDatabase

  GlueCrawler:
    Description: Glue crawler
    Value: !Ref GlueCrawler

  GlueJob:
    Description: Glue ETL job
    Value: !Ref GlueJob

  GlueWorkflow:
    Description: Glue workflow
    Value: !Ref GlueWorkflow

  LambdaFunction:
    Description: Processing Lambda
    Value: !Ref LambdaFunction
