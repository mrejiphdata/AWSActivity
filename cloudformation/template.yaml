AWSTemplateFormatVersion: '2010-09-09'

Description: GitHub AWS Activity - CloudFormation Infrastructure

Parameters:
  InputBucketName:
    Type: String
    Default: github-aws-activity-input

  OutputBucketName:
    Type: String
    Default: github-aws-activity-output

Resources:

  # ============================================================
  # S3 BUCKETS
  # ============================================================

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  # ============================================================
  # LAMBDA ROLE
  # ============================================================

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: github-aws-activity-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

              # S3 access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub '${InputBucket.Arn}/*'
                  - !GetAtt OutputBucket.Arn
                  - !Sub '${OutputBucket.Arn}/*'

              # S3 notification configuration
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !GetAtt InputBucket.Arn

              # Glue Workflow access
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflow
                  - glue:GetWorkflowRun
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/github-aws-activity-workflow'


  # ============================================================
  # GLUE ROLE
  # ============================================================

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-glue-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: github-aws-activity-glue-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # S3 access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub '${InputBucket.Arn}/*'
                  - !GetAtt OutputBucket.Arn
                  - !Sub '${OutputBucket.Arn}/*'

              # Glue access
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                  - glue:StartCrawler
                  - glue:GetCrawler
                  - glue:GetJob
                  - glue:StartJobRun
                  - glue:GetWorkflowRunProperties
                Resource: '*'

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'


  # ============================================================
  # GLUE DATABASE
  # ============================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: github_aws_activity_db


  # ============================================================
  # GLUE CRAWLER
  # ============================================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn:
      - GlueRole
      - InputBucket
      - GlueDatabase

    Properties:
      Name: github-aws-activity-crawler
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase

      Targets:
        S3Targets:
          - Path: !Sub 's3://${InputBucket}/input/'

      TablePrefix: ''

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG


  # ============================================================
  # GLUE JOB
  # ============================================================

  GlueJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueRole
      - InputBucket

    Properties:
      Name: github-aws-activity-etl
      Role: !GetAtt GlueRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub 's3://${InputBucket}/scripts/ETLtrialJob.py'

      MaxCapacity: 0.0625
      MaxRetries: 0

      DefaultArguments:
        '--library-set': analytics


  # ============================================================
  # GLUE WORKFLOW
  # ============================================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: github-aws-activity-workflow
      MaxConcurrentRuns: 1


  # ============================================================
  # START TRIGGER
  # ============================================================

  StartTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueCrawler
      - GlueWorkflow

    Properties:
      Name: github-aws-activity-start
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflow

      Actions:
        - CrawlerName: !Ref GlueCrawler


  # ============================================================
  # CRAWLER SUCCESS TRIGGER
  # ============================================================

  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueCrawler
      - GlueJob
      - GlueWorkflow

    Properties:
      Name: github-aws-activity-crawler-success
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref GlueWorkflow

      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueJob


  # ============================================================
  # S3 NOTIFICATION LAMBDA
  # ============================================================

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: github-aws-activity-s3-notification
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt LambdaRole.Arn

      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          s3 = boto3.client("s3")

          def send_response(event, context, status, data=None):
              response = {
                  "Status": status,
                  "Reason": "See CloudWatch logs",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              }

              body = json.dumps(response).encode("utf-8")

              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT"
              )

              req.add_header("Content-Type", "")
              req.add_header("Content-Length", str(len(body)))

              urllib.request.urlopen(req)

          def handler(event, context):

              try:
                  bucket = event["ResourceProperties"]["Bucket"]
                  target_lambda = event["ResourceProperties"]["LambdaArn"]

                  if event["RequestType"] == "Delete":
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  else:
                      configuration = {
                          "LambdaFunctionConfigurations": [
                              {
                                  "LambdaFunctionArn": target_lambda,
                                  "Events": ["s3:ObjectCreated:*"],
                                  "Filter": {
                                      "Key": {
                                          "FilterRules": [
                                              {
                                                  "Name": "prefix",
                                                  "Value": "input/"
                                              },
                                              {
                                                  "Name": "suffix",
                                                  "Value": ".csv"
                                              }
                                          ]
                                      }
                                  }
                              }
                          ]
                      }

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=configuration
                      )

                  send_response(event, context, "SUCCESS")

              except Exception as e:
                  print(e)

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(e)}
                  )


  # ============================================================
  # ACTUAL PROCESSING LAMBDA
  # ============================================================

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaRole

    Properties:
      FunctionName: github-aws-activity-lambda
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaRole.Arn

      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.parse

          glue_client = boto3.client("glue")

          WORKFLOW_NAME = "github-aws-activity-workflow"

          def lambda_handler(event, context):

              record = event["Records"][0]

              bucket = record["s3"]["bucket"]["name"]

              key = urllib.parse.unquote_plus(
                  record["s3"]["object"]["key"]
              )

              print("Bucket:", bucket)
              print("File:", key)

              if not key.lower().endswith(".csv"):
                  return {
                      "statusCode": 200,
                      "body": json.dumps("Not a CSV file")
                  }

              response = glue_client.start_workflow_run(
                  Name=WORKFLOW_NAME,
                  RunProperties={
                      "SOURCE_BUCKET": bucket,
                      "SOURCE_KEY": key
                  }
              )

              print("Workflow started:", response["RunId"])

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Glue Workflow started",
                      "workflow_run_id": response["RunId"],
                      "source_bucket": bucket,
                      "source_key": key
                  })
              }


  # ============================================================
  # PERMISSION FOR S3 TO INVOKE ACTUAL LAMBDA
  # ============================================================

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt InputBucket.Arn


  # ============================================================
  # CUSTOM RESOURCE TO CONFIGURE S3 NOTIFICATION
  # ============================================================

  ConfigureBucketNotification:
    Type: Custom::S3LambdaNotification

    DependsOn:
      - S3NotificationFunction
      - LambdaFunction
      - LambdaInvokePermission

    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      Bucket: !Ref InputBucket
      LambdaArn: !GetAtt LambdaFunction.Arn


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  InputBucket:
    Description: Input S3 bucket
    Value: !Ref InputBucket

  OutputBucket:
    Description: Output S3 bucket
    Value: !Ref OutputBucket

  GlueDatabase:
    Description: Glue database
    Value: !Ref GlueDatabase

  GlueCrawler:
    Description: Glue crawler
    Value: !Ref GlueCrawler

  GlueJob:
    Description: Glue ETL job
    Value: !Ref GlueJob

  GlueWorkflow:
    Description: Glue workflow
    Value: !Ref GlueWorkflow

  LambdaFunction:
    Description: Processing Lambda
    Value: !Ref LambdaFunction