AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSV ingestion pipeline:
  S3 input -> Lambda -> Glue Workflow -> Crawler -> Glue ETL Job -> S3 output

Parameters:

  InputBucketName:
    Type: String
    Default: aws-bootcamp-input-v2

  OutputBucketName:
    Type: String
    Default: aws-bootcamp-output-v2

  ScriptsBucketName:
    Type: String
    Default: aws-bootcamp-scripts-v2

  GlueDatabaseName:
    Type: String
    Default: aws_bootcamp_db_v2

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email for Glue failure alerts.

Conditions:

  HasNotificationEmail: !Not
    - !Equals
      - !Ref NotificationEmail
      - ""

Resources:

  # ========================================
  # 1. Input S3 Bucket
  # ========================================

  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ========================================
  # 2. Output S3 Bucket
  # ========================================

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ========================================
  # 3. Scripts S3 Bucket
  # ========================================

  ScriptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ScriptsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ========================================
  # 4. Lambda execution role
  # ========================================

  LambdaGlueTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaGlueTriggerRole-CFN
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: StartGlueWorkflowPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflowRun
                Resource: "*"

  # ========================================
  # 5. Glue service role
  # ========================================

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GlueETLRole-CFN
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:
        - PolicyName: S3AccessForGlue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/input/*"
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"
                  - !GetAtt ScriptsBucket.Arn
                  - !Sub "${ScriptsBucket.Arn}/glue/*"

  # ========================================
  # 6. Glue Database
  # ========================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Database for the CSV ingestion pipeline.

  # ========================================
  # 7. Glue Crawler
  # ========================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: github-aws-activity-crawler
      Role: !GetAtt GlueServiceRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/input/"

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING

  # ========================================
  # 8. Glue ETL Job
  # ========================================
  #
  # GitHub Actions uploads:
  # glue/ETLtrialJob.py
  # to:
  # s3://<ScriptsBucket>/glue/ETLtrialJob.py
  #

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: github-aws-activity-etl-job
      Role: !GetAtt GlueServiceRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptsBucketName}/glue/ETLtrialJob.py"

      DefaultArguments:
        "--INPUT_BUCKET": !Ref InputBucketName
        "--OUTPUT_BUCKET": !Ref OutputBucketName

      MaxCapacity: 0.0625
      GlueVersion: "3.0"
      Timeout: 30

  # ========================================
  # 9. Glue Workflow
  # ========================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: github-aws-activity-workflow
      Description: Orchestrates crawler -> ETL job for CSV ingestion.

  # ========================================
  # 10. Start Workflow Trigger
  # ========================================

  StartWorkflowTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: github-aws-activity-start
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflow

      Actions:
        - CrawlerName: !Ref GlueCrawler

      StartOnCreation: false

  # ========================================
  # 11. Crawler Success Trigger
  # ========================================

  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: github-aws-activity-crawler-success
      Type: CONDITIONAL
      WorkflowName: !Ref GlueWorkflow

      StartOnCreation: true

      Predicate:
        Logical: ANY
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueETLJob

  # ========================================
  # 12. Lambda Function
  # ========================================
  #
  # CloudFormation owns the Lambda function.
  # The Lambda code below is equivalent to the
  # S3 -> Glue Workflow trigger logic.
  #
  # The local lambda/lambda_function.py is kept in
  # the repository, but is not packaged because this
  # CloudFormation template embeds the Lambda code.

  StartGlueWorkflowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: github-aws-activity-start-glue-workflow
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaGlueTriggerRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          WORKFLOW_NAME: !Ref GlueWorkflow

      Code:
        ZipFile: |
          import boto3
          import os
          import urllib.parse

          glue = boto3.client("glue")
          WORKFLOW_NAME = os.environ["WORKFLOW_NAME"]

          def lambda_handler(event, context):
              for record in event.get("Records", []):
                  key = record["s3"]["object"]["key"]
                  key = urllib.parse.unquote_plus(key)

                  if key.lower().endswith(".csv"):
                      response = glue.start_workflow_run(
                          Name=WORKFLOW_NAME
                      )

                      print(
                          f"Started workflow run "
                          f"{response['RunId']} for file {key}"
                      )

              return {
                  "statusCode": 200
              }

  # ========================================
  # 13. Allow S3 to invoke Lambda
  # ========================================

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartGlueWorkflowFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"
      SourceAccount: !Ref AWS::AccountId

  # ========================================
  # 14. Custom Resource Lambda for
  #     S3 -> Lambda notification
  # ========================================

  BucketNotificationConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BucketNotificationConfigRole-CFN
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ConfigureS3Notification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource: !GetAtt InputBucket.Arn

  BucketNotificationConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: configure-input-bucket-notification-v2
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketNotificationConfigRole.Arn
      Timeout: 60

      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request

          s3 = boto3.client("s3")

          def send_response(
              event,
              context,
              status,
              data,
              physical_resource_id
          ):
              body = json.dumps({
                  "Status": status,
                  "Reason": (
                      f"See CloudWatch Log Stream: "
                      f"{context.log_stream_name}"
                  ),
                  "PhysicalResourceId": physical_resource_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data
              }).encode("utf-8")

              request = urllib.request.Request(
                  url=event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "",
                      "Content-Length": str(len(body))
                  }
              )

              urllib.request.urlopen(request)

          def handler(event, context):
              props = event["ResourceProperties"]

              bucket = props["BucketName"]
              lambda_arn = props["LambdaArn"]

              physical_resource_id = (
                  f"s3-notification-{bucket}"
              )

              try:
                  if event["RequestType"] in ("Create", "Update"):
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              "LambdaFunctionConfigurations": [
                                  {
                                      "Id": "github-aws-activity-csv-trigger",
                                      "LambdaFunctionArn": lambda_arn,
                                      "Events": [
                                          "s3:ObjectCreated:*"
                                      ],
                                      "Filter": {
                                          "Key": {
                                              "FilterRules": [
                                                  {
                                                      "Name": "prefix",
                                                      "Value": "input/"
                                                  },
                                                  {
                                                      "Name": "suffix",
                                                      "Value": ".csv"
                                                  }
                                              ]
                                          }
                                      }
                                  }
                              ]
                          }
                      )

                  elif event["RequestType"] == "Delete":
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {},
                      physical_resource_id
                  )

              except Exception as error:
                  print(error)

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(error)},
                      physical_resource_id
                  )

  # ========================================
  # 15. Configure S3 Lambda notification
  # ========================================

  ConfigureInputBucketNotification:
    Type: Custom::S3LambdaNotification
    DependsOn:
      - LambdaInvokePermission
      - BucketNotificationConfigFunction

    Properties:
      ServiceToken: !GetAtt BucketNotificationConfigFunction.Arn
      BucketName: !Ref InputBucket
      LambdaArn: !GetAtt StartGlueWorkflowFunction.Arn
      ConfigVersion: "1"

  # ========================================
  # 16. SNS Alerts
  # ========================================

  AlertsTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: github-aws-activity-alerts

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      TopicArn: !Ref AlertsTopic
      Endpoint: !Ref NotificationEmail

  # ========================================
  # 17. EventBridge Rule - Glue Job Failure
  # ========================================

  GlueJobFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: github-aws-activity-glue-job-failure
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Job State Change
        detail:
          jobName:
            - !Ref GlueETLJob
          state:
            - FAILED

      Targets:
        - Arn: !Ref AlertsTopic
          Id: GlueJobFailureTarget

  # ========================================
  # 18. EventBridge Rule - Glue Crawler Failure
  # ========================================

  GlueCrawlerFailureRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Name: github-aws-activity-crawler-failure
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Crawler State Change
        detail:
          crawlerName:
            - !Ref GlueCrawler
          state:
            - FAILED

      Targets:
        - Arn: !Ref AlertsTopic
          Id: GlueCrawlerFailureTarget

  # ========================================
  # 19. SNS Topic Policy
  # ========================================

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasNotificationEmail
    Properties:
      Topics:
        - !Ref AlertsTopic

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref AlertsTopic

# ========================================
# Outputs
# ========================================

Outputs:

  InputBucketName:
    Description: Input S3 bucket
    Value: !Ref InputBucket

  OutputBucketName:
    Description: Output S3 bucket
    Value: !Ref OutputBucket

  ScriptsBucketName:
    Description: Bucket containing ETLtrialJob.py
    Value: !Ref ScriptsBucket

  GlueDatabaseName:
    Description: Glue database
    Value: !Ref GlueDatabaseName

  GlueCrawlerName:
    Description: Glue crawler
    Value: !Ref GlueCrawler

  GlueJobName:
    Description: Glue ETL job
    Value: !Ref GlueETLJob

  GlueWorkflowName:
    Description: Glue workflow
    Value: !Ref GlueWorkflow

  LambdaFunctionName:
    Description: Lambda function triggered by S3
    Value: !Ref StartGlueWorkflowFunction

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt StartGlueWorkflowFunction.Arn
