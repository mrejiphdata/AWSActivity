AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AWS Activity serverless ETL infrastructure.
  Creates S3 buckets, IAM roles, Glue database,
  crawler, Python Shell ETL job, Glue workflow,
  triggers, Lambda function and S3 event notification.

Resources:

  # ============================================================
  # 1. INPUT S3 BUCKET
  # ============================================================

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: github-aws-activity-input

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true


  # ============================================================
  # 2. OUTPUT S3 BUCKET
  # ============================================================

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: github-aws-activity-output

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true


  # ============================================================
  # 3. LAMBDA EXECUTION ROLE
  # ============================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-lambda-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaExecutionPermissions
          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # Lambda CloudWatch Logs
              - Sid: LambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # Read CSV from input bucket
              - Sid: ReadInputBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/*"

              # Start Glue workflow
              - Sid: StartGlueWorkflow
                Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                  - glue:GetWorkflow
                  - glue:GetWorkflowRun
                  - glue:GetWorkflowRunProperties
                Resource: "*"


  # ============================================================
  # 4. GLUE EXECUTION ROLE
  # ============================================================

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-aws-activity-glue-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: GlueExecutionPermissions
          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # Read input bucket
              - Sid: ReadInputBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/*"

              # Write output bucket
              - Sid: WriteOutputBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"

              # Glue Data Catalog
              - Sid: GlueDataCatalog
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                Resource: "*"

              # Workflow properties
              - Sid: GlueWorkflowProperties
                Effect: Allow
                Action:
                  - glue:GetWorkflowRunProperties
                Resource: "*"

              # Glue CloudWatch logs
              - Sid: GlueLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # Glue metrics
              - Sid: GlueMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"


  # ============================================================
  # 5. GLUE DATABASE
  # ============================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: github_aws_activity_db
        Description: AWS Activity Glue database


  # ============================================================
  # 6. GLUE CRAWLER
  # ============================================================

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn:
      - GlueExecutionRole
      - GlueDatabase

    Properties:
      Name: github-aws-activity-crawler

      Role: !GetAtt GlueExecutionRole.Arn

      DatabaseName: !Ref GlueDatabase

      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucket}/input/"

      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING


  # ============================================================
  # 7. GLUE PYTHON SHELL JOB
  # ============================================================

  GlueETLJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueExecutionRole
      - InputBucket

    Properties:
      Name: github-aws-activity-etl

      Role: !GetAtt GlueExecutionRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${InputBucket}/scripts/ETLtrialJob.py"

      MaxCapacity: 0.0625

      MaxRetries: 0

      DefaultArguments:
        "--library-set": analytics


  # ============================================================
  # 8. GLUE WORKFLOW
  # ============================================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: github-aws-activity-workflow
      Description: AWS Activity serverless ETL workflow
      MaxConcurrentRuns: 1


  # ============================================================
  # 9. WORKFLOW START TRIGGER
  # ============================================================

  GlueWorkflowStartTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueWorkflow
      - GlueCrawler

    Properties:
      Name: github-aws-activity-start

      WorkflowName: !Ref GlueWorkflow

      Type: ON_DEMAND

      Actions:
        - CrawlerName: !Ref GlueCrawler


  # ============================================================
  # 10. CRAWLER SUCCESS TRIGGER
  # ============================================================

  GlueCrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueWorkflow
      - GlueCrawler
      - GlueETLJob

    Properties:
      Name: github-aws-activity-crawler-success

      WorkflowName: !Ref GlueWorkflow

      Type: CONDITIONAL

      StartOnCreation: true

      Predicate:
        Logical: AND

        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawler
            CrawlState: SUCCEEDED

      Actions:
        - JobName: !Ref GlueETLJob


  # ============================================================
  # 11. LAMBDA FUNCTION
  # ============================================================

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaExecutionRole

    Properties:
      FunctionName: github-aws-activity-lambda

      Runtime: python3.14

      Handler: lambda_function.lambda_handler

      Role: !GetAtt LambdaExecutionRole.Arn

      Timeout: 30

      MemorySize: 128

      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.parse
          import os

          glue = boto3.client("glue")

          WORKFLOW_NAME = os.environ.get(
              "GLUE_WORKFLOW",
              "github-aws-activity-workflow"
          )

          def lambda_handler(event, context):

              print("Received S3 event:")
              print(json.dumps(event))

              for record in event.get("Records", []):

                  bucket = record["s3"]["bucket"]["name"]

                  key = urllib.parse.unquote_plus(
                      record["s3"]["object"]["key"]
                  )

                  print(f"Processing file: s3://{bucket}/{key}")

                  response = glue.start_workflow_run(
                      Name=WORKFLOW_NAME,
                      RunProperties={
                          "input_file": key,
                          "input_bucket": bucket
                      }
                  )

                  print(
                      f"Glue workflow started: "
                      f"{response['RunId']}"
                  )

              return {
                  "statusCode": 200,
                  "body": json.dumps(
                      "Glue workflow started successfully"
                  )
              }

      Environment:
        Variables:
          GLUE_WORKFLOW: github-aws-activity-workflow


  # ============================================================
  # 12. EVENTBRIDGE PERMISSION FOR LAMBDA
  # ============================================================

  LambdaEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId


  # ============================================================
  # 13. EVENTBRIDGE RULE
  # ============================================================
  #
  # S3 -> EventBridge -> Lambda
  #
  # Only CSV files inside input/ are processed.
  #
  # ============================================================

  S3CSVEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - LambdaEventBridgePermission

    Properties:
      Name: github-aws-activity-csv-trigger

      Description: >
        Trigger Lambda whenever a CSV file is uploaded
        to the input folder.

      State: ENABLED

      EventPattern:
        source:
          - aws.s3

        detail-type:
          - Object Created

        detail:
          bucket:
            name:
              - github-aws-activity-input

          object:
            key:
              - prefix: input/
              - suffix: .csv

      Targets:
        - Id: LambdaTarget
          Arn: !GetAtt LambdaFunction.Arn


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  InputBucketName:
    Description: Input S3 bucket
    Value: !Ref InputBucket


  OutputBucketName:
    Description: Output S3 bucket
    Value: !Ref OutputBucket


  GlueDatabaseName:
    Description: Glue database
    Value: !Ref GlueDatabase


  GlueCrawlerName:
    Description: Glue crawler
    Value: !Ref GlueCrawler


  GlueJobName:
    Description: Glue ETL job
    Value: !Ref GlueETLJob


  GlueWorkflowName:
    Description: Glue workflow
    Value: !Ref GlueWorkflow


  GlueStartTriggerName:
    Description: Glue workflow start trigger
    Value: !Ref GlueWorkflowStartTrigger


  GlueCrawlerSuccessTriggerName:
    Description: Glue crawler success trigger
    Value: !Ref GlueCrawlerSuccessTrigger


  LambdaFunctionName:
    Description: Lambda function
    Value: !Ref LambdaFunction


  LambdaFunctionArn:
    Description: Lambda ARN
    Value: !GetAtt LambdaFunction.Arn