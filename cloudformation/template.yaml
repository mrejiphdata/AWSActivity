AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub AWS Activity pipeline - S3 upload triggers Lambda, which starts a
  Glue Workflow (crawler -> conditional trigger -> Python Shell ETL job).
  Replaces the imperative aws-cli steps previously in deploy.yml.

Parameters:
  InputBucketName:
    Type: String
    Default: github-aws-activity-input
  OutputBucketName:
    Type: String
    Default: github-aws-activity-output
  GlueDatabaseName:
    Type: String
    Default: github_aws_activity_db
  GlueCrawlerName:
    Type: String
    Default: github-aws-activity-crawler
  GlueJobName:
    Type: String
    Default: github-aws-activity-etl
  GlueWorkflowName:
    Type: String
    Default: github-aws-activity-workflow
  LambdaFunctionName:
    Type: String
    Default: github-aws-activity-lambda
  LambdaRoleName:
    Type: String
    Default: github-aws-activity-lambda-role
  GlueRoleName:
    Type: String
    Default: github-aws-activity-glue-role
  LambdaPolicyName:
    Type: String
    Default: github-aws-activity-lambda-policy
  GluePolicyName:
    Type: String
    Default: github-aws-activity-glue-policy

Resources:

  # ========================================
  # IAM - Lambda
  # ========================================

  LambdaExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref LambdaPolicyName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StartGlueWorkflow
            Effect: Allow
            Action:
              - glue:StartWorkflowRun
            Resource: "*"
          - Sid: LambdaCloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref LambdaRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaExecutionPolicy

  # ========================================
  # IAM - Glue
  # ========================================

  GlueExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref GluePolicyName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadInputBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:aws:s3:::${InputBucketName}"
              - !Sub "arn:aws:s3:::${InputBucketName}/*"
          - Sid: WriteOutputBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:aws:s3:::${OutputBucketName}"
              - !Sub "arn:aws:s3:::${OutputBucketName}/*"
          - Sid: GlueDataCatalog
            Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetPartition
              - glue:GetPartitions
              - glue:CreateTable
              - glue:UpdateTable
              - glue:CreatePartition
              - glue:BatchCreatePartition
              - glue:UpdatePartition
            Resource: "*"
          - Sid: GlueWorkflowProperties
            Effect: Allow
            Action:
              - glue:GetWorkflowRunProperties
            Resource: "*"
          - Sid: GlueLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
          - Sid: GlueMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"

  GlueExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref GlueRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref GlueExecutionPolicy

  # ========================================
  # Lambda function (inline code - small,
  # boto3-only, so no S3 zip upload needed)
  # ========================================

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.parse

          glue_client = boto3.client("glue")

          WORKFLOW_NAME = "github-aws-activity-workflow"


          def lambda_handler(event, context):

              record = event["Records"][0]

              bucket = record["s3"]["bucket"]["name"]

              key = urllib.parse.unquote_plus(
                  record["s3"]["object"]["key"]
              )

              print("Bucket:", bucket)
              print("File:", key)

              if not key.lower().endswith(".csv"):
                  return {
                      "statusCode": 200,
                      "body": json.dumps("Not a CSV file")
                  }

              response = glue_client.start_workflow_run(
                  Name=WORKFLOW_NAME,
                  RunProperties={
                      "SOURCE_BUCKET": bucket,
                      "SOURCE_KEY": key
                  }
              )

              print("Workflow started:", response["RunId"])

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Glue Workflow started",
                      "workflow_run_id": response["RunId"],
                      "source_bucket": bucket,
                      "source_key": key
                  })
              }

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      # Hardcoded (not !GetAtt InputBucket...) on purpose: the bucket name
      # is fixed via the parameter above, so we can reference its ARN here
      # without creating a InputBucket -> Permission -> InputBucket cycle.
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"
      SourceAccount: !Ref AWS::AccountId

  # ========================================
  # S3 buckets
  # ========================================

  InputBucket:
    Type: AWS::S3::Bucket
    # Forces the permission to exist before S3 tries to validate/apply the
    # Lambda notification config against it (S3 checks the Lambda resource
    # policy at PutBucketNotificationConfiguration time).
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt LambdaFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: input/
                  - Name: suffix
                    Value: .csv

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ========================================
  # Glue Data Catalog
  # ========================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: AWS Activity Glue database

  GlueCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: GlueDatabase
    Properties:
      Name: !Ref GlueCrawlerName
      Role: !GetAtt GlueExecutionRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/input/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  # ========================================
  # Glue ETL job
  # ========================================
  # NOTE: ScriptLocation points at an object the workflow uploads AFTER
  # this stack deploys (see deploy.yml). Glue does not validate that the
  # script exists at job-creation time, only when the job actually runs,
  # so this ordering is safe.

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Ref GlueJobName
      Role: !GetAtt GlueExecutionRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub "s3://${InputBucketName}/scripts/ETLtrialJob.py"
      MaxCapacity: 0.0625
      MaxRetries: 0
      DefaultArguments:
        "--library-set": analytics

  # ========================================
  # Glue Workflow + triggers
  # ========================================

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Ref GlueWorkflowName
      Description: AWS Activity serverless ETL workflow
      MaxConcurrentRuns: 1

  GlueStartTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueWorkflow
      - GlueCrawler
    Properties:
      Name: github-aws-activity-start
      WorkflowName: !Ref GlueWorkflowName
      Type: ON_DEMAND
      Actions:
        - CrawlerName: !Ref GlueCrawlerName

  GlueCrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueWorkflow
      - GlueCrawler
      - GlueETLJob
    Properties:
      Name: github-aws-activity-crawler-success
      WorkflowName: !Ref GlueWorkflowName
      Type: CONDITIONAL
      # This is the exact bug that broke the old imperative deploy: a
      # CONDITIONAL trigger created without being activated sits in
      # CREATED state and never fires. StartOnCreation fixes it natively.
      StartOnCreation: true
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueCrawlerName
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref GlueJobName

Outputs:
  InputBucketName:
    Value: !Ref InputBucket
  OutputBucketName:
    Value: !Ref OutputBucket
  LambdaFunctionArn:
    Value: !GetAtt LambdaFunction.Arn
  GlueWorkflowName:
    Value: !Ref GlueWorkflowName
  GlueCrawlerSuccessTriggerName:
    Description: >-
      Name only (CFN doesn't expose trigger State as an attribute) - verify
      its actual state after deploy with: aws glue get-trigger --name
      <this value> --query 'Trigger.State'. It must read ACTIVATED, not
      CREATED, or the ETL job will never fire after the crawler succeeds.
    Value: !Ref GlueCrawlerSuccessTrigger
